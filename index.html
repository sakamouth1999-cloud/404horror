function sound(f=110,len=.22){if(s.mute)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),v=audio.createGain();o.type='triangle';o.frequency.setValueAtTime(f,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(35,f/2),audio.currentTime+len);v.gain.setValueAtTime(.075,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+len);o.connect(v);v.connect(audio.destination);o.start();o.stop(audio.currentTime+len)}catch(e){}}

function show(t){modal=t;sound(155,.12);render()}function archiveKey(n){if(n==='C')s.archiveDigits='';else if(n==='OK'){if(s.archiveDigits==='0404'){s.archiveOpen=1;show('保管箱が開いた。中には事故の録音と封印の手順がある。')}else{s.wrong++;s.archiveDigits='';sound(52,.5);show(s.wrong>=3?'番号が違う。背後で棚が倒れる音。……振り向くと何もない。':'番号が違う。棚の奥で紙が擦れる音がした。')}save();return}else if(s.archiveDigits.length<4)s.archiveDigits+=n;save();render()}function journal(){let a=['調査記録'];if(s.note)a.push('苦情票：存在しない404号室から足音');if(s.diary)a.push('管理日誌：1987年4月4日に事故');if(s.key)a.push('鍵束：4の刻印');if(s.photo)a.push('写真：1987年4月4日');if(s.tape)a.push('録音テープ：1987が鍵');if(s.truth)a.push('契約書：自分の署名、退去不可');if(s.archive)a.push('地下台帳：保管箱の管理番号0404');if(s.archiveOpen)a.push('保管箱：事故の録音と封印の手順');if(s.mirror)a.push('鏡：もう一人の自分が先に動いた');if(s.wallCrack)a.push('404号室：壁の奥に隠し通路');if(s.hiddenNote)a.push('隠し通路：「忘れたのは、誰？」');if(a.length===1)a.push('まだ手掛かりはない。');show(a.join('　／　'))}function hint(){s.hints++;save();let h=scene==='office'?'苦情票を調べてから四階へ。':scene==='hall'?'廊下の奥の404号室と地下階段を調べよう。':scene==='door'?'管理人室で鍵を手に入れよう。':scene==='inside'?'写真・電話・引き出し・壁の金庫・鏡を調べよう。':scene==='photo'?'写真の日付と録音テープを照らし合わせよう。':scene==='safe'?'4桁の番号は写真と録音テープにある。':scene==='stairs'?'配電盤で電気を復旧して地下保管庫へ。':scene==='archive'?'台帳に記された管理番号を保管箱に入力しよう。':scene==='mirror'?'鏡に触れてから404号室へ戻ろう。':scene==='passage'?'壁の文字を調べ、404号室へ戻ろう。':'すべての記録をつなぎ合わせよう。';show('ヒント：'+h)}function keypress(n){if(n==='C')s.number='';else if(n==='OK'){if(s.number==='1987'){s.box=1;s.codeSeen=1;puzzle=false;show('カチリ。金庫が開いた。中には404号室の契約書と、あなたの署名がある。');}else{s.number='';shake=6;show('番号が違う。金庫の奥で何かが動いた。')}save();return}else if(s.number.length<4)s.number+=n;save();render()}function go(t){scene=t;modal='';s.visited++;if(t==='passage')s.passageVisits++;save();syncAmbience();sound(70,.35);if(['inside','passage','mirror'].includes(t)&&s.visited%3===0)sound(48,.8);render()}function gain(k,msg){if(!s[k]){s[k]=1;save()}show(msg)}function investigate(k,first,again){let fresh=!s[k];s[k]=1;save();show(fresh?first:again||first)}
