function render(){g.setTransform(1,0,0,1,0,0);rect(0,0,c.width,c.height,'#050808');g.setTransform(sc,0,0,sc,ox,oy);areas=[];if(scene==='title'){gradient(0,0,390,844,'#202c29','#030606');door(94,185,202,435,'404',true);text('黒瀬ハイツ',195,112,18,'#b3bfb4','center');text('404号室',195,163,51,'#e4e4d8','center');text('存在しない部屋から、苦情が届いた。',195,665,15,'#c4c9bd','center');button('第一夜をはじめる',58,727,274,()=>go('office'));noise();return}
