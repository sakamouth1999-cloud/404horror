function renderChoice(){bg('exit');header('最終章　午前三時十二分','出口にいる男');rect(18,164,354,385,'rgba(8,13,13,.89)');txt('黒瀬「それを外へ出すのか」',35,207,18,'#e3d1b7');let y=252;for(let p of ['携帯には証拠が揃っている。','送信すれば、会社が何十年も隠した事件が再び動き出す。','だが、男は出口を塞いでいる。','母が何を願ったのか、あなたはまだ答えを知らない。']){let n=lines(p,35,y,20,17,29);y+=n*29+21}btn('証拠を外部へ送る',25,616,340,()=>finish('expose'));btn('携帯をしまい、逃げる',25,684,340,()=>finish('flee'));btn('記録帳を確認',25,752,340,()=>{s.screen='journal';save();draw()})}

function renderEnding(){bg('exit');let expose=s.ending==='expose';header(expose?'告発':'沈黙','事件のその後');rect(17,145,356,517,'rgba(8,13,13,.9)');txt(expose?'消せなかった記録':'消えなかった声',195,196,25,'#e5d6bd','center');let ps=expose?['証拠は夜明け前に外部へ届いた。','1987年の事件について再捜査が始まり、管理会社の隠蔽も報じられた。','黒瀬は姿を消した。母の行方は、まだ分からない。','数日後、差出人のない封筒が届く。','中には母の手紙の続きがあった。','「あなたが生きている。それだけで、私は負けていない」']:['あなたは携帯をしまい、非常口から逃げ出した。','翌朝、採用の取り消し通知が届く。','添付されていたのは、昨夜のあなたの行動記録だった。','黒瀬は何も失っていない。404号室も再び壁の向こうに隠された。','それでも、あなたの手元には母の写真が残る。','今度は誰が、壁を三回叩くのだろう。'];let y=244;for(let p of ps){let n=lines(p,35,y,20,15,25);y+=n*25+16}txt('完',195,633,23,'#e8e0cf','center');btn('もう一度はじめる',27,711,336,begin);btn('タイトルへ',27,771,336,()=>{s.screen='title';save();draw()})}
function draw(){let d=Math.min(devicePixelRatio||1,3),cw=innerWidth,ch=innerHeight;c.width=Math.round(cw*d);c.height=Math.round(ch*d);let scale=Math.min(c.width/W,c.height/H),ox=(c.width-W*scale)/2,oy=(c.height-H*scale)/2;c.dataset.scale=scale;c.dataset.ox=ox;c.dataset.oy=oy;g.setTransform(1,0,0,1,0,0);rect(0,0,c.width,c.height,'#050808');g.setTransform(scale,0,0,scale,ox,oy);hits=[];if(s.screen==='title')renderTitle();else if(s.screen==='chapter')renderChapter();else if(s.screen==='code')renderCode();else if(s.screen==='journal')renderJournal();else if(s.screen==='choice')renderChoice();else if(s.screen==='ending')renderEnding();if(s.modal)renderModal()}
c.addEventListener('pointerup',e=>{let scale=+c.dataset.scale,ox=+c.dataset.ox,oy=+c.dataset.oy,x=(e.clientX*c.width/c.clientWidth-ox)/scale,y=(e.clientY*c.height/c.clientHeight-oy)/scale;for(let h of [...hits].reverse())if(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h){h.fn();return}});
addEventListener('resize',draw);draw();
})();</script></body></html>
