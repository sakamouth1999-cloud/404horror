{title:'新しい暮らし',place:'管理室',time:'11月18日 17:30',image:'assets/office.webp',fallback:'assets/title.webp',objective:'仕事を覚え、管理室の備品を確認する',intro:'黒瀬ハイツでの住み込みアルバイトが始まった。まずは仕事を覚えよう。',spots:[['郵便受け',25,59,'mail','郵便物を部屋番号順に仕分けるための郵便受け。'],['鍵棚',72,46,'key','鍵が番号順に並んでいる。奥に「旧物置」と書かれた古い鍵が一本ある。'],['仕事の手帳',52,78,'handbook','清掃、郵便の仕分け、共用設備の確認。管理室の合鍵は佐伯も預かっている。']],end:'仕事の引き継ぎが終わった。夜遅く、403号室の水野から物音についての連絡が入った。'},

const c=chapters[s.chapter],header=E('header');const brand=E('div');brand.append(E('div','404号室','brand'),E('small','黒瀬ハイツ / 調査記録'));header.append(brand,E('div',c.time,'clock'));app.append(header);
const stage=E('section');stage.id='stage';stage.className='fade';stage.style.backgroundImage='linear-gradient(180deg,#05090920,#05090955),url("'+c.image+'")';stage.append(E('div','CHAPTER '+String(s.chapter+1).padStart(2,'0')+' / '+c.place,'location'));c.spots.forEach(([name,x,y,id,description])=>{const b=B(s.found[id]?'✓':'+',()=>add(id,name,description),'hotspot'+(s.found[id]?' seen':''));b.style.left=x+'%';b.style.top=y+'%';b.setAttribute('aria-label',name+'を調べる');b.title=name;stage.append(b)});stage.append(E('div','＋を押して周囲を調べる','scenefoot'));const inStory=renderStory(stage);app.append(stage);if(inStory){const nav=E('nav');nav.className='bottom';[['▤','証拠帳',journal],['?','ヒント',hint],['☰','メニュー',menu]].forEach(([ic,t,f])=>{const b=B('',f);b.append(E('span',ic),document.createTextNode(t));nav.append(b)});app.append(nav);return}
const main=E('main');main.append(E('div','CHAPTER '+String(s.chapter+1).padStart(2,'0')+' / 08','eyebrow'),E('h2',c.title),E('div','現在の目的｜'+c.objective,'objective'),E('div','調査 '+c.spots.filter(x=>s.found[x[3]]).length+' / 3　・　推理 '+(s.solved[s.chapter]?'完了':'未完了'),'status'));
if(s.solved[s.chapter])main.append(B(s.chapter===7?'結末を読む':'次の章へ進む',()=>{if(s.chapter===7){s.finished=true;save();ending()}else{s.chapter++;resetScene();save();render();window.scrollTo(0,0)}},'btn primary'));else main.append(B(done()?(s.chapter===0?'仕事の引き継ぎを終える':s.chapter===4?'報告書を照合する':s.chapter===7?'事件の時系列を再構築する':'集めた証拠から推理する'):(c.spots.every(x=>s.found[x[3]])?'会話を進める':'周囲を調べる'),()=>done()?deduce():(c.spots.every(x=>s.found[x[3]])?showPostTalk():hint()),'btn primary'));
main.append(B('これまでの物語を読み返す',recap,'btn secondary'));app.append(main);
const nav=E('nav');nav.className='bottom';[['▤','証拠帳',journal],['◇','推理',deduce],['?','ヒント',hint],['☰','メニュー',menu]].forEach(([icon,label,fn])=>{const b=B('',fn);b.append(E('span',icon),document.createTextNode(label));nav.append(b)});app.append(nav)}

const caseTimeline=[
{date:'10月3日',label:'佳奈が物置に閉じ込められる',id:'kana'},
{date:'10月8日',label:'真理が佳奈を逃がす',id:'escape'},
{date:'10月9日',label:'真理が建物に戻り、拘束される',id:'mari'},
{date:'10月12日',label:'食事の搬入記録が途絶える',id:'lastMeal'}
];
function evidenceComparison(){
 const rows=[
 ['録音装置を確認した。','録音装置を確認した。',false],
 ['原因の調査を継続する。','原因の調査を継続する。',false],
 ['（記載なし）','旧物置の配線を早急に撤去すること。',true]
 ];
 sheet.replaceChildren(E('h3','報告書の差異を探す'),E('p','左右の報告書を見比べ、提出版だけにある行をタップしてください。'));
 const table=E('div');table.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0';
 [['下書き','draft'],['会社提出版','report']].forEach(([name])=>{const t=E('strong',name);t.style.cssText='text-align:center;padding:8px;background:#263333';table.append(t)});
 rows.forEach(([left,right,correct])=>{
  const l=E('div',left);l.style.cssText='padding:12px 8px;border:1px solid #66716a;min-height:62px;white-space:normal';table.append(l);
  const btn=B(right,()=>{if(!correct)return show('一致する文章',['その行は下書きにもある。追加された指示を探そう。'],[['比較に戻る',evidenceComparison]]);s.events.compareDone=true;save();speakSequence([['主人公','この「旧物置の配線を早急に撤去すること」という一文は、僕の下書きにはない。'],['主人公','提出された時刻は、水野さんと四階にいた。'],['水野','管理室の端末から、誰かが追記した可能性があります。'],['主人公','ただ、送信履歴だけでは操作した人までは特定できない。']],()=>{save();render()})},'btn');btn.style.cssText='white-space:normal;min-height:62px;text-align:left';table.append(btn)
 });
 sheet.append(table,B('証拠帳を確認',journal,'btn secondary'),B('調査に戻る',hide,'btn secondary'));modal.classList.add('show');sheet.scrollTop=0
}
function timelinePuzzle(){
 if(!s.events.timeline)s.events.timeline=[];
 const picked=s.events.timeline;
 sheet.replaceChildren(E('h3','1987年の出来事を並べる'),E('p','手帳・出勤簿・食事記録・工事記録から分かる順番に、出来事を選ぼう。'));
 const bar=E('div',undefined,'objective');bar.textContent=picked.length?picked.map(id=>caseTimeline.find(x=>x.id===id)).map(x=>x.date+' '+x.label).join(' → '):'まだ出来事を選んでいない。';sheet.append(bar);
 const order=[caseTimeline[2],caseTimeline[0],caseTimeline[3],caseTimeline[1]];
 order.forEach(item=>{const b=B(item.label,()=>{if(picked.includes(item.id))return;const expected=caseTimeline[picked.length];if(item.id!==expected.id)return show('時系列が合わない',['この出来事より前に起きたことがある。日付と証言を確認しよう。'],[['並べ直す',timelinePuzzle],['最初から',()=>{s.events.timeline=[];save();timelinePuzzle()}]]);picked.push(item.id);save();if(picked.length===4){s.events.timelineDone=true;save();speakSequence([['主人公','十月三日に佳奈さんが閉じ込められた。'],['水野','八日に真理さんが伯母を逃がした。'],['主人公','九日に真理さんが戻った。その後、十二日まで食事が運ばれている。'],['水野','その後、奥の区画が塞がれた。図面と工事記録を警察に渡しましょう。']],()=>{render()})}else timelinePuzzle()},'btn'+(picked.includes(item.id)?' secondary':''));b.disabled=picked.includes(item.id);sheet.append(b)});
 sheet.append(B('最初から並べ直す',()=>{s.events.timeline=[];save();timelinePuzzle()},'btn secondary'));sheet.append(B('証拠帳',journal,'btn secondary'));modal.classList.add('show')
}

function deduce(){if(s.solved[s.chapter])return show('推理済み',['この章の推理は完了している。']);if(!done()){if(chapters[s.chapter].spots.every(x=>s.found[x[3]])&&!s.events['talk'+s.chapter])return showPostTalk();return hint()}if(s.chapter===4&&!s.events.compareDone)return evidenceComparison();if(s.chapter===7&&!s.events.timelineDone)return timelinePuzzle();if(s.chapter===0){s.solved[0]=true;save();return show('引き継ぎ完了',['仕事の手順を確認した。古い鍵は勝手に使わず、必要になったら高瀬に相談しよう。'],[['翌日へ',()=>{s.chapter=1;save();hide();window.scrollTo(0,0)}],['記録を見る',journal]])}const q=questions[s.chapter];show('推理｜'+chapters[s.chapter].title,[q.q],q.a.map((a,i)=>[a,()=>{if(i!==q.right)return show('もう一度考えよう',['証拠帳の記述を見比べれば、答えは一つに絞れる。'],[['証拠帳を見る',journal],['推理に戻る',deduce]]);s.solved[s.chapter]=true;save();show('推理成立',[q.why],[['物語を続ける',()=>{hide();if(s.chapter===7){s.finished=true;save();ending()}else{s.chapter++;save();render();window.scrollTo(0,0)}}],['証拠帳を見る',journal]])}]).concat([['探索に戻る',hide]]))}
function journal(){
 sheet.replaceChildren(E('h3','証拠帳'),E('p','記録した証拠を選ぶと、画像と観察メモをもう一度確認できる。'));
 if(!s.log.length)sheet.append(E('p','まだ記録がない。背景の＋から調べよう。'));
 s.log.forEach(x=>{const b=B('第'+(x.chapter+1)+'章｜'+x.name,()=>inspectEvidence(x),'btn secondary');sheet.append(b)});
 sheet.append(B('調査へ戻る',hide,'btn'));modal.classList.add('show');sheet.scrollTop=0
}
function inspectEvidence(x){
 sheet.replaceChildren(E('h3',x.name));
 const img=E('img');img.className='itempic';img.src=itemArt(x.id);img.alt=x.name+'の証拠画像';img.style.cssText='width:100%;max-height:65vh;object-fit:contain;cursor:zoom-in';
 let zoom=false;img.addEventListener('click',()=>{zoom=!zoom;img.style.maxHeight=zoom?'none':'65vh';img.style.cursor=zoom?'zoom-out':'zoom-in'});
 sheet.append(img,E('p',x.description),E('p','画像をタップして拡大・縮小できます。'));
 sheet.append(B('証拠帳に戻る',journal,'btn primary'),B('調査に戻る',hide,'btn secondary'));
 modal.classList.add('show');sheet.scrollTop=0
}
function recap(){show('これまでの記録',chapters.slice(0,s.chapter+1).map((c,i)=>'第'+(i+1)+'章　'+c.title+'\n'+(s.solved[i]?c.end:'現在調査中')), [['戻る',hide]])}
function hint(){const c=chapters[s.chapter],missing=c.spots.filter(x=>!s.found[x[3]]);if(s.chapter===3&&s.found.speaker&&!s.events.moritaDone)return show('調査のヒント',['スピーカーの設置者について、森田に質問しよう。'],[['森田に話を聞く',morita],['戻る',hide]]);show('調査のヒント',[missing.length?'まだ確認していない場所：'+missing.map(x=>x[0]).join('・'):'証拠は揃っている。推理で、各記録が示す事実を結びつけよう。','間違えてもペナルティはない。証拠帳はいつでも見返せる。'])}
function menu(){show('メニュー',['進行状況はこの端末に自動保存される。'],[['設定',settings],['タイトルに戻る',()=>{s.started=false;save();hide()}],['閉じる',hide]])}
function settings(){show('設定',['読みやすさを優先し、音だけを手掛かりにする謎は設けていない。'],[['文字サイズ：'+(s.large?'大':'標準'),()=>{s.large=!s.large;save();settings()}],['音：'+(s.sound?'オン':'オフ')+'（現在は環境音なし）',()=>{s.sound=!s.sound;save();settings()}],['セーブデータを消去',()=>show('初期化の確認',['すべての調査記録を消去する。元には戻せない。'],[['消去する',()=>{s=fresh();save();hide()}],['やめる',settings]])],['戻る',()=>{hide()}]])}
function ending(){show('404号室｜終章',['警察の捜査で、封鎖された空間から藤崎真理の遺骨が発見された。','佐伯が過去の監禁と隠蔽に関わっていたことも明らかになった。','佳奈は真理の墓に花を供えた。\n\n「あなたが助けてくれたから、私は生きてこられた」','佐伯のアルバムには、佳奈と主人公の写真が並んでいた。どちらにも同じ言葉が添えられている。\n\n「正義感が強い。人の頼みを断れない。利用しやすい」','―― 調査終了 ――'],[['タイトルへ',()=>{s.started=false;save();hide()}],['証拠帳',journal]])}
modal.addEventListener('click',e=>{if(e.target===modal)hide()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('show'))hide()});try{render()}catch(err){document.getElementById('app').innerHTML='<section class="intro"><h1>404号室</h1><p>起動に失敗しました。ページを再読み込みしてください。</p><button class="btn primary" onclick="location.reload()">再読み込み</button></section>';console.error(err)}
})();</script></body></html>
