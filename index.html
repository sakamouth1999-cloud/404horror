<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>404号室</title><style>html,body{margin:0;background:#090d0e;overflow:hidden}canvas{width:100vw;height:100dvh;display:block;touch-action:manipulation}</style><canvas id="game"></canvas><script>
const c=document.querySelector('canvas'),g=c.getContext('2d');let room=0,photo=false,phone=false,dialog='',buttons=[];function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;draw()}onresize=resize;
function rect(x,y,w,h,color){g.fillStyle=color;g.fillRect(x,y,w,h)}function text(t,x,y,size=20,color='#e4e0d7'){g.fillStyle=color;g.font=size+'px sans-serif';g.fillText(t,x,y)}function button(t,x,y,fn){rect(x,y,250,55,'#293434');g.strokeStyle='#8c9893';g.strokeRect(x,y,250,55);text(t,x+15,y+35,17);buttons.push({x,y,w:250,h:55,fn})}function show(t){dialog=t;draw()}function go(n){room=n;dialog='';draw()}
function draw(){g.setTransform(c.width/960,0,0,c.height/540,0,0);buttons=[];rect(0,0,960,540,'#11191a');rect(0,0,960,75,'#070b0c');text(['404号室','管理人室','四階廊下','404号室の前','404号室','夜明け'][room],35,48,28);rect(50,100,860,300,'#1c2524');
if(room===0){text('この建物に、404号室は存在しない。',245,220,25);text('午前2時44分',405,270,20);button('はじめる',355,420,()=>go(1))}
if(room===1){rect(170,150,300,180,'#55564e');text('苦情票',265,235,25);button('苦情票を読む',70,420,()=>show('404号室から、夜中に物音がする。'));button('管理人日誌',355,420,()=>show('四階には401、402、403号室しかない。'));button('四階へ',640,420,()=>go(2))}
if(room===2){for(let i=0;i<3;i++){rect(145+i*235,140,155,240,'#39423f');text('40'+(i+1),190+i*235,195,27)}button('突き当たりへ',70,420,()=>go(3));button('廊下を調べる',355,420,()=>show('蛍光灯が明滅する。奥に扉が見える。'));button('戻る',640,420,()=>go(1))}
if(room===3){rect(330,120,300,275,'#343c39');text('404',445,195,37);button('扉を調べる',70,420,()=>show('表札は404。冷たい金属の感触。'));button('扉を開ける',355,420,()=>go(4));button('戻る',640,420,()=>go(2))}
if(room===4){rect(170,150,180,180,'#393d39');text('写真',228,245);rect(615,150,150,180,'#343838');text('電話',662,245);button('写真を見る',70,420,()=>{photo=true;show('自分が写っている。裏には「1987年4月4日」。')});button('電話を取る',355,420,()=>{phone=true;show('「今度は忘れないで」……声が途切れた。')});button('部屋を出る',640,420,()=>photo&&phone?go(5):show('まだ調べていないものがある。'))}
if(room===5){text('夜明け。新しい苦情票が届く。',270,205,25);text('「405号室から、物音がする」',285,265,24);text('第一章　終',420,335,24);button('最初から',355,420,()=>{photo=phone=false;go(0)})}
if(dialog){rect(50,340,860,165,'#050808');g.strokeStyle='#aab5ad';g.strokeRect(50,340,860,165);let chars=[...dialog];for(let i=0;i<chars.length;i+=32)text(chars.slice(i,i+32).join(''),75,390+Math.floor(i/32)*32,20);text('タップで閉じる',755,485,14);buttons=[{x:0,y:0,w:960,h:540,fn:()=>{dialog='';draw()}}]}}
c.addEventListener('pointerup',e=>{let r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*960,y=(e.clientY-r.top)/r.height*540;for(let b of buttons)if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){b.fn();break}});resize();
</script></html>
