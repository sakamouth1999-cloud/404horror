<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090e10"><title>404号室｜消された階</title><style>
*{box-sizing:border-box}body{margin:0;background:#080d0e;color:#e6e2d7;font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif}button{font:inherit;cursor:pointer}#app{max-width:490px;margin:auto;min-height:100dvh;background:#111818;position:relative;box-shadow:0 0 90px #000}header{padding:16px 18px;background:#111719;border-bottom:1px solid #8e795d}header b{letter-spacing:3px;font-size:19px}header small{display:block;color:#b2a58e;margin-top:6px}#visual{height:35dvh;min-height:220px;max-height:340px;position:relative;background-size:cover;background-position:center;overflow:hidden}#visual:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,#111818 100%);pointer-events:none}#spots{position:absolute;inset:0;z-index:2}.spot{position:absolute;border:1px solid #c9b58b88;background:#101b1955;color:#fff;border-radius:50%;width:43px;height:43px;transform:translate(-50%,-50%);box-shadow:0 0 18px #d4c08d55}.spot:before{content:"+";font-size:22px}.spot.seen{border-color:#78887a66;color:#8d9d8b;background:#111a1877}.spot.seen:before{content:"✓";font-size:16px}main{padding:14px 18px 120px}h2{font-size:21px;margin:8px 0 10px}p{font-size:15px;line-height:1.8;color:#d4d4c9;margin:8px 0}.sub{font-size:12px;color:#a9a58f;letter-spacing:1px}.panel{background:#1b2423;border:1px solid #5d665c;padding:13px;margin:12px 0;border-radius:3px}.action{display:block;width:100%;background:#30332f;border:1px solid #9c8b6e;color:#f0ecdf;padding:13px;margin:8px 0;text-align:left;border-radius:3px;min-height:45px}.action:disabled{opacity:.38}.action.secondary{background:#192221;border-color:#687468}#tabs{display:flex;gap:6px;position:sticky;bottom:0;background:#0a1010;padding:12px 9px;border-top:1px solid #7e705c}#tabs button{flex:1;background:#242c2a;color:#e7e1d3;border:1px solid #766e5d;padding:11px 2px;font-size:13px}#overlay{position:fixed;inset:0;background:#000c;z-index:10;display:none;align-items:center;justify-content:center;padding:15px}#dialog{width:min(440px,100%);max-height:86dvh;overflow:auto;background:#15201f;border:1px solid #baa17a;padding:22px;box-shadow:0 12px 60px #000}#dialog h3{margin:0 0 15px;color:#e3d2b5}#dialog p{white-space:pre-line}#dialog button{width:100%;background:#313b35;color:#eee;border:1px solid #a79576;padding:13px;margin-top:12px}#notice{color:#d7b68c;font-size:13px}.danger{color:#e2a9a2}#intro{padding:30px 24px 130px;text-align:center;min-height:90dvh;background:linear-gradient(#090e0e77,#090e0eea),url('assets/title.webp') center/cover}#intro h1{font-size:55px;margin:100px 0 16px;letter-spacing:4px}#intro p{margin:22px 0 50px}.evidence{display:inline-block;padding:7px 9px;margin:3px;border:1px solid #8d826c;background:#28312d;font-size:12px}#clock{float:right;color:#b8a28a}
</style></head><body><div id="app"></div><div id="overlay"><div id="dialog"></div></div><script>
(()=>{'use strict';
const rooms=[
{id:'office',name:'管理人室',desc:'初めての夜勤。引き継ぎ担当は来ず、机には苦情票だけが残されている。',spots:[['机の引き出し',24,65,'memo','苦情票の控え。苦情が出されたのは「404号室」ではなく「404号室の隣」と読める。筆圧の跡が残っている。'],['鍵のかかった棚',77,55,'key','棚の裏に予備鍵。鍵の札は「点検口」。'],['留守番電話',52,35,'call','録音「四階の工事は予定通り。夜勤者が来たら点検口を施錠して」声の主は名乗らない。']]},
{id:'hall',name:'四階廊下',desc:'403号室の先は行き止まり。壁は古いが、床だけが妙に新しい。',spots:[['避難経路図',24,38,'map','古い避難図では、四階の端に小さな共用倉庫がある。部屋番号は書かれていない。'],['床の傷',70,75,'floor','キャスターの新しい擦り傷。誰かが最近、重いものを壁の向こうへ運んでいる。'],['403号室の郵便受け',45,55,'letter','投函された紙。「夜中のノックは配管の音。騒がないで」差出人の欄は空白。']]},
{id:'door',name:'壁の点検口',desc:'倉庫のはずの場所に、扉の輪郭が浮かぶ。ここは本当に404号室なのだろうか。',spots:[['点検口の錠',51,55,'lock','鍵穴は管理用。扉の奥に空気の流れがある。'],['壁の塗装',22,42,'paint','上塗りの下に、古い「管理用」という文字。ここが居室だった証拠はない。'],['換気口',78,33,'vent','女の泣き声が聞こえる。耳を寄せると同じ息継ぎが繰り返されている。']]},
{id:'passage',name:'壁の内側',desc:'細い通路には新しい足跡。古い事件の跡と、今夜の誰かの行動が重なっている。',spots:[['小型スピーカー',28,34,'speaker','タイマー式の音声装置。女の声もノックも、ここから流せる。'],['古い作業日誌',75,67,'work','1987年「女性の保護に伴い一時隔離」。ただし責任者の署名欄が切り取られている。'],['床下の封筒',48,82,'envelope','封筒には新しい紙幣と、最近の管理会社の領収印。今夜も誰かがここを使っている。']]},
{id:'archive',name:'地下資料庫',desc:'帳簿の山。数字は残っていても、名前だけが消されている。',spots:[['旧台帳',22,44,'ledger','1987年の記録。四階の倉庫には「一時保護者」の記載。居住者名はない。'],['改修契約書',75,45,'contract','封鎖工事は失踪届より前。発注者は管理会社ではなく、当時の警備会社。'],['廃棄記録',50,75,'trash','昨年も同じ形式の書類が廃棄された。1987年の一度きりの事件ではない可能性。']]},
{id:'surveillance',name:'監視室',desc:'六台のモニター。映っているのは廊下だけではない。',spots:[['映像ログ',23,35,'video','昨夜、作業服の人物が音声装置を設置。顔はフードで見えない。'],['監視対象一覧',76,35,'targets','あなたの名前がある。だが監視開始日は、採用面接の三か月前。'],['通話履歴',50,75,'calls','警備会社と管理会社の通話記録。今夜の侵入者を「確認役」と呼んでいる。']]},
{id:'photo',name:'封印された記録',desc:'写真、古いメモ、そして消された証言。何を信じるべきか。',spots:[['古い集合写真',28,40,'picture','1987年の集合写真。失踪したとされる女性が、事件の翌月の日付の写真にも写っている。'],['証言の写し',73,54,'statement','「本人は出ていった」。しかし証言者の氏名は伏せられ、署名もない。'],['手書きの地図',45,80,'route','当時の避難経路には建物の外へ続く別の搬出口がある。今は壁で塞がれている。']]},
{id:'exit',name:'非常階段',desc:'出口の前に誰かがいる。相手はあなたの手元を見ている。',spots:[['落ちた社員証',29,65,'badge','写真の人物は管理会社の現役社員。1987年の警備会社の関係者と同じ名字だが、同一人物とは限らない。'],['非常扉の留め金',75,56,'bolt','内側から外せる。だが扉を開ければ、ここにいることが知られる。'],['置かれた携帯端末',52,35,'device','「証拠を送れば、あなたの身元も公表する」と未送信のメッセージ。']]},
];
const puzzles=[
{title:'最初の矛盾',q:'404号室が存在したという噂に、まず疑いを持てる証拠の組み合わせは？',opts:[['memo','map'],['call','floor'],['key','letter']],right:0,good:'苦情の宛先は「404号室の隣」。古い図面には番号のない倉庫。誰かが「404号室」という呼び名を作った可能性がある。'},
{title:'壁の向こうへ',q:'今も誰かが点検口を使っていると判断できる組み合わせは？',opts:[['paint','map'],['floor','vent'],['floor','envelope']],right:2,good:'新しい擦り傷と新しい領収印。古い怪談の舞台が、今も使われている。'},
{title:'音の正体',q:'怪異が自然現象ではなく、人為的に作られたと示す証拠は？',opts:[['vent','speaker'],['work','ledger'],['key','contract']],right:0,good:'換気口の泣き声は、壁内の装置が繰り返し再生していた。だが、1987年に何が起きたかはまだ分からない。'},
{title:'事件の時系列',q:'「女性は封鎖後に失踪した」という説明と食い違うのは？',opts:[['contract','ledger'],['trash','map'],['work','floor']],right:0,good:'封鎖工事は失踪届より前。しかも工事発注者は警備会社。管理会社だけを犯人と決めつけるのは早い。'},
{title:'今夜の目的',q:'あなたが偶然ここに来たのではないと示す記録は？',opts:[['targets','calls'],['video','badge'],['ledger','picture']],right:0,good:'監視は面接前から。通話ではあなたを「確認役」と呼ぶ。誰かはあなたの行動を観察したかった。'},
{title:'最後の推理',q:'「女性は1987年にこの部屋で亡くなった」という前提を揺るがすのは？',opts:[['picture','route'],['statement','speaker'],['badge','device']],right:0,good:'事件の翌月の写真と、外へ続く搬出口。女性はあの夜に外へ出た可能性がある。ただし写真の日付が正しいとは限らない。'}
];
const app=document.querySelector('#app'),overlay=document.querySelector('#overlay'),dialog=document.querySelector('#dialog');
const fresh=()=>({room:0,found:{},solved:0,alert:0,turn:0,ending:'',started:false,notes:[],pending:false});
let s=fresh();try{const saved=JSON.parse(localStorage.getItem('horror404v6'));if(saved&&saved.found)s={...fresh(),...saved}}catch(e){}
function save(){localStorage.setItem('horror404v6',JSON.stringify(s))}
function button(t,fn,cl='action'){let b=document.createElement('button');b.className=cl;b.textContent=t;b.onclick=fn;return b}
function el(tag,txt,cls){let e=document.createElement(tag);if(txt!==undefined)e.textContent=txt;if(cls)e.className=cls;return e}
function open(title,paras,choices){overlay.style.display='flex';dialog.replaceChildren(el('h3',title));for(let p of paras)dialog.append(el('p',p));if(choices)for(let c of choices)dialog.append(button(c[0],()=>{close();c[1]()}));else dialog.append(button('閉じる',close))}
function close(){overlay.style.display='none';render()}
function gain(item,label,description){let first=!s.found[item];s.found[item]=true;if(first)s.notes.push({label,description});s.turn++;if(s.room>=3&&s.room<=5&&s.turn%4===0)s.alert=Math.min(3,s.alert+1);save();open(label,[description,first?'証拠を記録帳に追加した。':'すでに確認した証拠だ。'])}
function required(i){return rooms[i].spots.every(a=>s.found[a[3]])}
function render(){app.replaceChildren();if(!s.started){let intro=el('section',undefined);intro.id='intro';intro.append(el('h1','404号室'),el('p','存在しない部屋の噂。消された記録。あなた自身で、矛盾を見つけろ。'),button('新しく調査を始める',()=>{s=fresh();s.started=true;save();render()}),button('前回の調査を続ける',()=>{s.started=true;save();render()},'action secondary'));app.append(intro);return}
let room=rooms[s.room],header=el('header');header.append(el('b','黒瀬ハイツ'));let sub=el('small',room.name+'　|　推理 '+s.solved+'/6');header.append(sub);app.append(header);
let visual=el('div');visual.id='visual';visual.style.backgroundImage="linear-gradient(#0b111155,#0b111155),url('assets/"+room.id+".webp')";let spots=el('div');spots.id='spots';room.spots.forEach(a=>{let b=button('',()=>gain(a[3],a[0],a[4]),'spot'+(s.found[a[3]]?' seen':''));b.style.left=a[1]+'%';b.style.top=a[2]+'%';b.title=a[0];spots.append(b)});visual.append(spots);app.append(visual);
let main=el('main');main.append(el('div','調査地点 '+(s.room+1)+' / '+rooms.length,'sub'),el('h2',room.name),el('p',room.desc));let count=room.spots.filter(a=>s.found[a[3]]).length;main.append(el('p','見つけた手掛かり：'+count+' / '+room.spots.length,'sub'));
if(s.room===3||s.room===4||s.room===5){let p=el('p','警戒度：'+['低','注意','高','危険'][s.alert]+'　（調べすぎると巡回者が近づく）',s.alert>=2?'danger':'sub');main.append(p);if(s.alert>=2)main.append(button('物陰で巡回をやり過ごす',()=>{s.alert=0;s.turn++;save();open('息を潜める',['足音が通り過ぎた。ここに誰かがいるのは確かだ。'])},'action secondary'))}
if(s.room===2&&!s.found.key)main.append(el('p','点検口には鍵が必要だ。管理人室に戻って探そう。','danger'));
if(s.room===rooms.length-1&&s.solved===6){main.append(button('証拠を公開する',()=>ending('publish')));main.append(button('記録を持って逃げる',()=>ending('leave')))}
else if(s.room<rooms.length-1){let ready=required(s.room)&&s.solved===Math.min(s.room,6);let b=button(ready?'証拠を照合して先へ進む':'この場所の証拠を集める',()=>{if(!required(s.room))return open('調査が足りない',['画像内の「＋」を調べて、手掛かりを集めよう。']);if(s.room===2&&!s.found.key)return open('鍵がない',['管理人室の棚を調べよう。']);if(s.room>=3&&s.alert>=2)return open('巡回者が近い',['このまま動くと見つかる。先に物陰に隠れよう。']);if(s.room===6){s.room++;save();render();return}deduce()},'action');main.append(b);if(s.room===6&&required(6)&&s.solved===6){main.append(button('非常階段へ',()=>{s.room=7;save();render()}))}}
if(s.room>0)main.append(button('前の場所に戻る',()=>{s.room--;save();render()},'action secondary'));app.append(main);
let tabs=el('div');tabs.id='tabs';tabs.append(button('証拠帳',journal),button('推理',()=>deduce(true)),button('ヒント',hint),button('タイトル',()=>{s.started=false;save();render()}));app.append(tabs)
}
function deduce(review=false){if(s.solved>=6)return open('推理は完了',['最後に、あなた自身でどう行動するか決めよう。']);let p=puzzles[s.solved];let all=p.opts.every(pair=>pair.every(id=>s.found[id]));if(!all&&!required(s.room))return open('まだ情報が足りない',['現場の手掛かりを探そう。']);let choices=p.opts.map((pair,i)=>[pair.map(id=>{for(let r of rooms)for(let a of r.spots)if(a[3]===id)return a[0];return id}).join(' ＋ '),()=>{if(i===p.right){s.solved++;if(s.room<6)s.room++;else if(s.room===6)s.room=7;save();open('矛盾を発見',[p.good,'新しい調査地点が開いた。'])}else{s.alert=Math.min(3,s.alert+1);save();open('その組み合わせでは説明できない',['証拠のどの部分が矛盾するか、記録帳を読み直そう。'])}}]);open(p.title,[p.q,'二つの証拠を選んで照合する。'],choices)}
function journal(){let arr=s.notes;open('調査記録',arr.length?arr.map(a=>'■ '+a.label+'\n'+a.description):['まだ記録がない。背景の「＋」をタップして調べよう。'])}
function hint(){let missing=rooms[s.room].spots.filter(a=>!s.found[a[3]]);let msg=missing.length?'未調査：'+missing.map(a=>a[0]).join('、'):s.solved<6?'証拠は揃った。推理画面で、説明が食い違う二つの記録を探そう。':'出口へ進もう。';open('調査のヒント',[msg,'推理は失敗してもやり直せる。巡回の警戒度が高い時は隠れよう。'])}
function ending(kind){s.ending=kind;save();let a=kind==='publish'?['記録は外部へ送られた。翌朝、警備会社と管理会社の関係が報道される。','だが1987年の女性がどこへ消えたのか、確かな答えはない。','数日後、差出人のない封筒が届く。「写真の日付を信じるな」','あなたが暴いたのは事件の全貌ではなく、誰かが残した入口だった。']:['あなたは記録を持って建物を離れた。翌朝、404号室の噂はネットから消えている。','机の上には見覚えのない写真。あなたが調査していた夜、背後から撮られたものだった。','裏には一言。「まだ誰にも渡していないね」'];open(kind==='publish'?'公開された記録':'持ち帰った記録',a.concat(['終']),[['もう一度調査する',()=>{s=fresh();s.started=true;save();render()}],['タイトルへ',()=>{s.started=false;save();render()}]])}
render();
})();</script></body></html>
