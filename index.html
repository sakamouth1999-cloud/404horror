<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050809"><meta name="apple-mobile-web-app-capable" content="yes"><title>404号室 | 黒瀬ハイツ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600&family=Shippori+Mincho:wght@400;600&family=Zen+Kurenaido&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#080c0d;--panel:#0e1516;--line:#3e4a46;--text:#ece6da;--muted:#a9aea5;--accent:#d6b486;--red:#d9786f;--fs:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:var(--text);font-family:"Noto Sans JP","Hiragino Sans",sans-serif;font-size:var(--fs);overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid #f0c48b;outline-offset:2px}
#blur{position:fixed;inset:-40px;background:#000 center/cover;filter:blur(28px) brightness(.35);transform:scale(1.1);z-index:0;transition:background-image .6s}
#app{position:relative;z-index:1;display:flex;flex-direction:column;width:min(100%,820px);height:100vh;height:100dvh;margin:0 auto;background:#050809cc}
header{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid #2c3532;background:#0a1011e6;font-size:12px;letter-spacing:.08em}
header .ch{color:var(--accent);font-family:"Shippori Mincho",serif;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .clk{font-variant-numeric:tabular-nums;color:#d8d2c4;text-align:right;white-space:nowrap;padding-left:8px}
#stagewrap{flex:0 0 auto}
#stage{position:relative;width:min(100%,calc(46dvh * 1.5));aspect-ratio:3/2;margin:0 auto;overflow:hidden;background:#0b0f10}
#bgimg{position:absolute;inset:0;background:#0b0f10 center/cover no-repeat;transition:opacity .5s,filter .5s}
#bgimg.cafe{background:radial-gradient(circle at 30% 35%,#e6a85a55 0 4%,transparent 9%),radial-gradient(circle at 72% 28%,#e6a85a44 0 3%,transparent 8%),radial-gradient(circle at 55% 60%,#c98c4a33 0 6%,transparent 14%),linear-gradient(180deg,#2a1d14,#120c08 70%)}
#bgimg.black{background:#030505}
#stage:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0004,transparent 30%,transparent 70%,#000a);pointer-events:none}
#spots{position:absolute;inset:0;z-index:3}
.spot{position:absolute;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;border:1.5px solid #f0d3a6;background:#0b1415b0;color:#f6e6c8;font-size:22px;line-height:1;box-shadow:0 0 0 5px #0006,0 0 16px #000;animation:pulse 2.6s ease-in-out infinite;transition:opacity .25s}
.spot.seen{border-color:#7f948a;color:#9fb3a8;animation:none;opacity:.55;font-size:18px}
.spot .lb{position:absolute;top:50px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;background:#000b;padding:2px 6px;border-radius:3px;pointer-events:none}
@keyframes pulse{50%{box-shadow:0 0 0 9px #e0b97a33,0 0 22px #e0b97a88}}
#dark{position:absolute;inset:0;z-index:4;pointer-events:none;display:none}
#stage.dark #dark{display:block}
#stage.dark .spot{opacity:0;pointer-events:none}
#stage.dark .spot.lit{opacity:1;pointer-events:auto}
#stage.dark .spot.seen.lit{opacity:.7}
#loc{position:absolute;left:10px;bottom:8px;z-index:5;font-size:11px;letter-spacing:.1em;color:#e9e1d0;text-shadow:0 1px 4px #000;pointer-events:none}
#fxl{position:absolute;inset:0;z-index:6;pointer-events:none}
#panel{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 18px 14px;background:linear-gradient(#0c1314f2,#070b0cf7);border-top:1px solid #33403b;position:relative}
#who{min-height:22px;font-size:13px;letter-spacing:.14em;font-weight:600;margin-bottom:6px}
#who:empty{min-height:0;margin:0}
#txt{font-family:"Shippori Mincho",serif;font-size:1.12rem;line-height:1.95;letter-spacing:.03em;white-space:pre-wrap;overflow-wrap:anywhere;min-height:3.9em}
#txt.narr{color:#d9d3c6}
#txt.voice{color:#ec9a90;font-style:italic;letter-spacing:.2em}
#txt .goal{display:block;font-family:"Noto Sans JP",sans-serif;font-size:.95rem;color:var(--accent);border-left:2px solid var(--accent);padding-left:10px;line-height:1.7}
#next{position:absolute;right:16px;bottom:10px;font-size:12px;color:#c9b18c;animation:blink 1.4s infinite;pointer-events:none}
@keyframes blink{50%{opacity:.25}}
#ctrl{display:flex;flex-direction:column;gap:8px;margin-top:10px}
#ctrl:empty{margin:0}
.btn{display:block;width:100%;text-align:left;min-height:48px;padding:12px 15px;border:1px solid #8e7a5d;border-radius:3px;background:#1d2522;line-height:1.55;font-size:.95rem}
.btn:active{background:#39433d}
.btn.pri{background:#3f392d;border-color:#d4b78b}
.btn.sub{background:#0f1617;border-color:#4c5852;color:#cfd3cb}
.btn.ctr{text-align:center}
.btn:disabled{opacity:.4}
.row{display:flex;gap:8px}.row .btn{flex:1;text-align:center}
nav{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #3c4843;background:#091011;padding-bottom:env(safe-area-inset-bottom)}
nav button{min-height:54px;font-size:12px;color:#d8d2c5;border-right:1px solid #1d2725}
nav button span{display:block;font-size:17px;margin-bottom:1px}
nav button.glow{color:#f3cf98}
/* testimony */
.testi{border:1px solid #6c5a45;background:#130f0c;padding:12px 14px;border-radius:3px}
.testi .tt{font-size:11px;letter-spacing:.2em;color:#e7a98f;margin-bottom:6px}
.testi .st{font-family:"Shippori Mincho",serif;font-size:1.08rem;line-height:1.85;min-height:3.7em;color:#f3e3c4}
.testi .dots{display:flex;gap:6px;margin-top:8px}.testi .dots i{width:8px;height:8px;border-radius:50%;background:#4b3f33}.testi .dots i.on{background:#e7a98f}
/* modal */
#modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:14px;padding-top:max(14px,env(safe-area-inset-top));background:#000c;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
#modal.show{display:flex}
#sheet{width:min(100%,560px);max-height:88dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#121a1b;border:1px solid #8d7a5f;border-radius:5px;padding:18px 16px 16px;box-shadow:0 20px 60px #000}
#sheet h3{font-family:"Shippori Mincho",serif;font-size:1.3rem;margin:0 0 10px;padding-bottom:10px;border-bottom:1px solid #3e4a46}
#sheet p{line-height:1.85;margin:.5em 0}
#sheet .small{font-size:12px;color:var(--muted)}
.newtag{display:inline-block;font-size:11px;letter-spacing:.15em;color:#111;background:var(--accent);padding:2px 8px;border-radius:2px;margin-bottom:8px}
.evlist{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.evlist button{text-align:left;padding:10px;border:1px solid #4a5650;background:#0d1415;border-radius:3px;font-size:.88rem;line-height:1.4;min-height:54px}
.evlist button small{display:block;color:#8e9a92;font-size:10px;margin-bottom:2px}
.evlist button.pick{border-color:#d4b78b;background:#2a2620}
/* documents */
.paper{background:#e8e0cc;color:#26221c;font-family:"Shippori Mincho",serif;padding:14px 14px;border-radius:2px;margin:10px 0;box-shadow:inset 0 0 40px #b8a98a88;font-size:.95rem;line-height:1.75}
.paper.dark{background:#1d2524;color:#e8e1d2;box-shadow:none;border:1px solid #4d5a55}
.paper.hand{font-family:"Zen Kurenaido","Shippori Mincho",serif;font-size:1.02rem}
.paper.mono{font-family:"Noto Sans JP",sans-serif;font-size:.85rem}
.paper h4{margin:0 0 8px;font-size:1rem;border-bottom:1px solid #8a7c62;padding-bottom:6px}
.paper p{margin:.35em 0!important;line-height:1.75!important}
.paper .sub{font-size:.8rem;color:#6a604f}
.paper.dark .sub{color:#9aa49c}
.paper ol,.paper ul{margin:.3em 0;padding-left:1.4em}
.paper .gap{color:#8a7f6c}
.paper .mk{border:1.5px solid #26221c;padding:0 4px;font-family:sans-serif;font-size:.8em}
.dt{width:100%;border-collapse:collapse;font-size:.82rem;margin:6px 0}
.dt th,.dt td{border:1px solid #9c8f74;padding:5px 6px;vertical-align:top;text-align:left}
.dt th{background:#d6cbb2}
.cols{display:flex;gap:8px}.cols .dt{flex:1}
.note{border:1px dashed #6b5f4c;padding:12px;margin:8px 0;font-size:1.05rem;line-height:1.9;background:#f3ecdc}
.note.print{font-family:"Noto Sans JP",sans-serif;text-align:center;font-size:1.05rem;background:#fff;color:#111}
.env{border:1px solid #9c8f74;padding:16px;background:#f4efe2;font-size:1rem;line-height:2}
.seal{display:inline-block;border:1.5px solid #b0362b;color:#b0362b;border-radius:50%;padding:4px 6px;font-size:.7rem;line-height:1.1;text-align:center;vertical-align:middle}
.hand2{font-family:"Zen Kurenaido",serif;font-size:1.25rem}
.hand2.big{font-size:1.5rem}
.art{width:100%;height:auto;display:block;border-radius:3px;margin:8px 0;background:#111}
.phone{border:6px solid #222;border-radius:16px;overflow:hidden;background:#111;margin:8px auto;max-width:300px}
.phone .pimg{height:150px;background:linear-gradient(180deg,#0006,#000a),url(assets/hall.webp) center/cover}
.phone .meta{padding:10px;font-size:.85rem;line-height:1.6;color:#ddd}
.mbgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.mb{border:1px solid #66706b;background:#2a3332;min-height:46px;padding:4px;text-align:center;font-size:.85rem;border-radius:2px}
.mb small{display:block;font-size:10px;color:#aab}
.mb.taped{background:repeating-linear-gradient(-20deg,#a08a5a,#a08a5a 6px,#8c774c 6px,#8c774c 12px)}
.mb.none{border:0;background:none}
/* puzzles */
.slotgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.slot{min-height:50px;border:1px solid #6b7671;background:#222b2a;border-radius:2px;font-size:.85rem;padding:4px 2px;text-align:center}
.slot.filled{background:#3a4a3e;border-color:#9fbf9f}
.slot.taped{background:repeating-linear-gradient(-20deg,#a08a5a,#a08a5a 6px,#8c774c 6px,#8c774c 12px);color:#2a2215}
.slot.empty{visibility:hidden}
.letters{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.letter{flex:1 1 44%;padding:10px;background:#efe7d4;color:#222;border-radius:2px;border:2px solid transparent;font-family:"Shippori Mincho",serif;font-size:.9rem;text-align:left;line-height:1.4}
.letter.sel{border-color:#e39b3d;box-shadow:0 0 0 2px #e39b3d55}
.letter.done{opacity:.25;pointer-events:none}
.tapdoc p.tl{cursor:pointer;border-radius:3px;padding:4px 6px;margin:3px 0!important;border:1px dashed transparent}
.tapdoc p.tl:active{background:#d8c9a4}
.tapdoc p.tl.hit{background:#f1c2a0;border-color:#b0362b}
svg .tap{cursor:pointer}
svg text{pointer-events:none}
svg .tap:hover,svg .tap:active{stroke:#fff;stroke-width:2.5}
.sigs{display:flex;flex-direction:column;gap:10px}
.sig{background:#e8e0cc;color:#26221c;padding:10px;border-radius:2px}
.sig small{display:block;font-size:11px;color:#6a604f;margin-bottom:6px}
.sig .chars{display:flex;gap:6px}
.sig .chars button{flex:1;font-family:"Zen Kurenaido","Hiragino Mincho ProN",serif;font-size:2.1rem;line-height:1.2;padding:8px 0;background:#f5efe1;border:1px solid #b9ab8d;border-radius:3px;color:#26221c}
.sig .chars button.hit{background:#f1c2a0;border-color:#b0362b}
.recon .ev{border:1px solid #4a5650;background:#0d1415;padding:10px 12px;border-radius:3px;margin:8px 0}
.recon .ev.ok{border-color:#86a98a;background:#13201a}
.recon .ev b{display:block;color:var(--accent);font-size:.85rem;margin-bottom:3px}
.recon .ev .sup{font-size:.8rem;color:#9fc3a3;margin-top:4px}
.album{background:#2a2420;border-radius:4px;padding:14px;border:1px solid #6b5a48}
.album .pg{background:#ece3cf;color:#2a241c;padding:14px;border-radius:2px;min-height:300px;font-family:"Shippori Mincho",serif;box-shadow:inset 0 0 30px #b7a68588}
.album .pic{height:150px;margin:0 0 10px;background:#777 center/cover;border:6px solid #fff;box-shadow:0 2px 6px #0005;transform:rotate(-1.5deg)}
.album .memo{font-family:"Zen Kurenaido",serif;font-size:1.12rem;line-height:1.9;color:#3a2a1e}
.album .yr{font-size:.8rem;color:#6a5a48}
.album .blank{display:flex;align-items:center;justify-content:center;color:#9a8c74;min-height:300px}
/* intro / cards */
#title{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;padding:30px 22px max(40px,env(safe-area-inset-bottom));background:linear-gradient(180deg,#0006 0%,#000a 45%,#000f 92%),url(assets/title.webp) center/cover}
#title h1{font-family:"Shippori Mincho",serif;font-size:clamp(56px,15vw,92px);letter-spacing:.14em;margin:0;text-shadow:0 6px 24px #000}
#title .tag{font-family:"Shippori Mincho",serif;line-height:2.1;margin:8px 0 26px;color:#ddd5c5}
#title .eb{font-size:11px;letter-spacing:.3em;color:var(--accent)}
#title .btn{width:min(100%,360px);text-align:center;margin:5px 0}
#title .cap{font-size:11px;color:#9a9a90;margin-top:14px;line-height:1.7}
#card{position:fixed;inset:0;z-index:25;display:none;flex-direction:column;align-items:center;justify-content:center;background:#000;text-align:center;padding:24px}
#card.show{display:flex;animation:fadein .8s both}
#card .n{font-size:12px;letter-spacing:.4em;color:var(--accent)}
#card h2{font-family:"Shippori Mincho",serif;font-size:clamp(30px,8vw,46px);letter-spacing:.12em;margin:14px 0}
#card .m{font-size:13px;color:#aaa;letter-spacing:.15em;line-height:2}
#card .tap{margin-top:40px;font-size:12px;color:#888;animation:blink 1.6s infinite}
@keyframes fadein{from{opacity:0}to{opacity:1}}
/* fx */
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(3px,0)}}
.flick #bgimg{animation:flick 1.2s}
@keyframes flick{10%,30%,55%{opacity:.15}20%,40%,70%{opacity:1}62%{opacity:.4}}
#fxl.red{animation:red 1.6s}
@keyframes red{0%{background:#a0000066}100%{background:transparent}}
#fxl.static{animation:stat 1.4s steps(8)}
@keyframes stat{0%,100%{background:transparent}10%,50%,90%{background:repeating-linear-gradient(0deg,#fff1 0 2px,#0000 2px 4px)}30%,70%{background:repeating-linear-gradient(0deg,#0000 0 1px,#fff2 1px 3px)}}
.big #txt{font-size:1.28rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(min-width:700px){#panel{padding:18px 26px}}

</style></head><body>

<script>
(function(){'use strict';
/* =========================================================
   404号室 ― 物語データ（確定版）
   行の書式：
     ['話者','台詞']        話者が '' なら地の文、'？？？' は正体不明の声
     ['@get','証拠ID']      証拠を入手（ポップアップ）
     ['@fx','knock']        演出 knock / ring / static / whisper / flicker / red / shake
     ['@bg','office']       背景切替
     ['@time','02:13']      時計表示の更新
   ========================================================= */

const CAST={
 '私':'#e8e1d2','佐伯':'#d9a56f','水野':'#8fbfd4','高瀬':'#b5b8ad','森田':'#c7a073',
 '佳奈':'#cf9fb6','久我':'#a3c39a','？？？':'#e07a72'
};


/* 﨑（たつさき）と崎を、フォントに頼らず確実に描き分ける */
function saki(tatsu,size){const part=(x,y,w,h,ch)=>'<svg x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" viewBox="0 0 100 100" preserveAspectRatio="none"><text x="50" y="86" font-size="98" text-anchor="middle" fill="currentColor" stroke="currentColor" stroke-width="2.5">'+ch+'</text></svg>';
 return '<svg class="saki" viewBox="0 0 100 100" style="width:'+(size||'1em')+';height:'+(size||'1em')+';vertical-align:-0.12em">'+part(0,18,42,74,'山')+part(36,2,64,50,tatsu?'立':'大')+part(36,46,64,52,'可')+'</svg>'}
const FUJI=t=>'藤'+saki(t)+'真理';
/* ---------- 証拠品 ---------- */
const P=(cls,html)=>'<div class="paper '+(cls||'')+'">'+html+'</div>';
const T=(rows,head)=>'<table class="dt">'+(head?'<tr>'+head.map(h=>'<th>'+h+'</th>').join('')+'</tr>':'')+rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</table>';

const EVIDENCE={
 handbook:{n:'業務手帳',ch:0,d:'前任者が残した管理業務の手帳。業者の手配方法や合鍵の管理者が書かれている。',
  doc:()=>P('','<h4>黒瀬ハイツ　管理業務手帳</h4><ol><li>共用部の清掃（毎朝）</li><li>郵便物の仕分け</li><li>共用設備の点検。異常は<b>報告書</b>で管理会社へ</li><li>業者の手配は<b>すべて管理会社経由</b>。発注記録を必ず残すこと</li></ol><p class="sub">■ 出入り業者</p><p>森田設備（ロゴ：<b class="mk">MS</b>）　電気・設備全般</p><p class="sub">■ 管理室の合鍵</p><p>高瀬（管理会社）<br>佐伯様（101号室・緊急時にご協力いただく）</p><p class="sub">■ 管理室PC</p><p>パスワードはモニター脇の付箋を参照</p>')},
 oldkey:{n:'旧物置の鍵',ch:0,d:'鍵棚の端にあった古い鍵。札の色だけが違う。',
  doc:()=>'<svg viewBox="0 0 300 200" class="art"><rect width="300" height="200" fill="#1a2222"/><circle cx="95" cy="90" r="34" fill="none" stroke="#b99a5e" stroke-width="14"/><path d="M128 90H250M220 90v28M240 90v20" stroke="#b99a5e" stroke-width="12" fill="none"/><path d="M70 120 L40 170" stroke="#7b6d58" stroke-width="3"/><rect x="10" y="162" width="120" height="34" fill="#c9b78f" transform="rotate(-8 70 180)"/><text x="18" y="186" font-size="15" fill="#2b2620" transform="rotate(-8 70 180)">4F物置 ※要連絡</text></svg>'+P('','<p>札の文字：「<b>4F物置</b>　※使用時は管理会社へ連絡のこと」</p>')},
 mailbox:{n:'郵便受け',ch:0,d:'四階の段だけ、401〜403の右にもう一つ枠がある。名札はなく、ガムテープで塞がれている。',
  doc:()=>{let h='<div class="mbgrid">';[['401','空室'],['402','空室'],['403','水野'],['','']].forEach(([a,b],i)=>{h+='<div class="mb'+(i===3?' taped':'')+'"><span>'+(a||'&nbsp;')+'</span><small>'+(b||'')+'</small></div>'});['301','302','303'].forEach(a=>h+='<div class="mb"><span>'+a+'</span></div>');h+='<div class="mb none"></div>';return P('dark','<p class="sub">黒瀬ハイツ　集合郵便受け（上二段）</p>'+h+'</div><p>四階の段の右端だけ、名札がない。テープは何度も貼り直された跡がある。</p>')}},
 seam:{n:'突き当たりの壁',ch:1,d:'四階の突き当たり、403号室の先の壁だけ塗装の色がわずかに違う。叩くと軽い音がする。',
  doc:()=>'<svg viewBox="0 0 300 200" class="art"><rect width="300" height="200" fill="#6f6a60"/><rect x="150" y="0" width="150" height="200" fill="#7a7466"/><path d="M150 0V200" stroke="#4a463f" stroke-width="2" stroke-dasharray="6 4"/><text x="160" y="190" font-size="13" fill="#2b2620">ここから色が違う</text><path d="M200 70l12 8-12 8" stroke="#2b2620" fill="none"/><text x="216" y="82" font-size="13" fill="#2b2620">コン…（軽い）</text></svg>'},

 const pts=[];for(let i=0;i<120;i++){const env=i<20?0.25:i<38?0.9:i<46?0.15:i<54?1:i<58?0.1:i<64?1:i<70?0.1:i<76?1:i<92?0.2:i<110?0.75:0.15;pts.push(env*(0.4+rnd()*0.6))}

}

 if(name==='knock'){thump(a,t);thump(a,t+.55);thump(a,t+1.1)}
 else if(name==='ring'){for(let i=0;i<2;i++){const o=a.createOscillator(),g=a.createGain();o.type='square';o.frequency.value=i?853:960;g.gain.value=0;[0,.5].forEach(d=>{g.gain.setValueAtTime(.05,t+d+i*.02);g.gain.setValueAtTime(0,t+d+.35)});o.connect(g).connect(a.destination);o.start(t);o.stop(t+.9)}}
 else if(name==='drag'){noise(a,t,1.1,'lowpass',380,.5);noise(a,t+1.3,1.2,'lowpass',330,.45)}
 else if(name==='whisper'){noise(a,t,1.4,'bandpass',1800,.35,7)}

 else if(name==='red'){const o=a.createOscillator(),g=a.createGain();o.type='sawtooth';o.frequency.value=48;g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+1.6);const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=200;o.connect(f).connect(g).connect(a.destination);o.start(t);o.stop(t+1.7)}

function fx(name){

 const re=(el,c)=>{el.classList.remove(c);void el.offsetWidth;el.classList.add(c);setTimeout(()=>el.classList.remove(c),1700)};

 if(name==='knock'){[0,550,1100].forEach(d=>setTimeout(()=>re(app,'shake'),d))}
 else if(name==='flicker'||name==='whisper'||name==='drag')re(st,'flick');

function play(lines,done,start,onIdx){let i=start||0;

  const who=$('#who');who.textContent=w&&w!==''?w:'';who.style.color=CAST[w]||'#e8e1d2';
